substitutions:
  RF_RX_PIN: GPIO19
  RF_TX_PIN: GPIO18
  IR_RX_PIN: GPIO33
  IR_TX_PIN: GPIO25
  LED_PIN: GPIO27
  RF_TEST_CODE: "000010101110010010001000"
  RF_PULSE_LENGTH: "393"
  IR_TEST_ADDRESS: "0xFF00"
  IR_TEST_COMMAND: "0xCB34"

esphome:
  name: factory-rf-ir-led-test
  friendly_name: remote
  on_boot:
    priority: -100
    then:
      - output.turn_off: status_led
      - lambda: |-
          id(rf_seen) = false;
          id(ir_seen) = false;
          id(test_round) = 0;
          id(rf_pass_count) = 0;
          id(rf_fail_count) = 0;
          id(ir_pass_count) = 0;
          id(ir_fail_count) = 0;
          id(both_pass_count) = 0;
          id(both_fail_count) = 0;
          ESP_LOGI("FACTORY", "Continuous RF433/IR loopback test started.");

esp32:
  board: esp32dev
  framework:
    type: arduino

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # This spawns an AP with the device name and mac address with no password.
  ap: {}

web_server:
  port: 80

captive_portal:

api:

logger:
  baud_rate: 115200
  level: INFO

# LED is active-high.
output:
  - platform: gpio
    pin:
      number: ${LED_PIN}
      inverted: false
    id: status_led

globals:
  - id: rf_seen
    type: bool
    restore_value: no
    initial_value: "false"
  - id: ir_seen
    type: bool
    restore_value: no
    initial_value: "false"
  - id: test_round
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: rf_pass_count
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: rf_fail_count
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: ir_pass_count
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: ir_fail_count
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: both_pass_count
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: both_fail_count
    type: uint32_t
    restore_value: no
    initial_value: "0"

remote_receiver:
  - id: rf_receiver
    pin:
      number: ${RF_RX_PIN}
      mode: INPUT
    dump:
      - rc_switch
    tolerance: 25%
    filter: 250us
    idle: 4ms

  - id: ir_receiver
    pin:
      number: ${IR_RX_PIN}
      inverted: true
      mode: INPUT_PULLUP
    dump:
      - nec
    tolerance: 25%

remote_transmitter:
  - id: rf_transmitter
    pin:
      number: ${RF_TX_PIN}
    carrier_duty_percent: 100%

  - id: ir_transmitter
    pin:
      number: ${IR_TX_PIN}
      inverted: false
    carrier_duty_percent: 50%

binary_sensor:
  - platform: remote_receiver
    receiver_id: rf_receiver
    id: rf_factory_code_seen
    name: "RF433 Factory Test Code"
    internal: true
    rc_switch_raw:
      code: "${RF_TEST_CODE}"
      protocol:
        pulse_length: ${RF_PULSE_LENGTH}
    on_press:
      - if:
          condition:
            lambda: "return !id(rf_seen);"
          then:
            - lambda: |-
                id(rf_seen) = true;

  - platform: remote_receiver
    receiver_id: ir_receiver
    id: ir_factory_code_seen
    name: "IR Factory Test Code"
    internal: true
    nec:
      address: ${IR_TEST_ADDRESS}
      command: ${IR_TEST_COMMAND}
    on_press:
      - if:
          condition:
            lambda: "return !id(ir_seen);"
          then:
            - lambda: |-
                id(ir_seen) = true;

script:
  - id: led_pass_on
    mode: restart
    then:
      - script.stop: led_fail_blink
      - output.turn_on: status_led

  - id: led_fail_blink
    mode: restart
    then:
      - while:
          condition:
            lambda: "return true;"
          then:
            - output.turn_on: status_led
            - delay: 300ms
            - output.turn_off: status_led
            - delay: 300ms

interval:
  - interval: 1s
    then:
      - lambda: |-
          id(test_round)++;
          id(rf_seen) = false;
          id(ir_seen) = false;

      - remote_transmitter.transmit_nec:
          transmitter_id: ir_transmitter
          address: ${IR_TEST_ADDRESS}
          command: ${IR_TEST_COMMAND}
          command_repeats: 1
      - delay: 120ms
      - remote_transmitter.transmit_rc_switch_raw:
          transmitter_id: rf_transmitter
          code: "${RF_TEST_CODE}"
          protocol:
            pulse_length: ${RF_PULSE_LENGTH}
          repeat:
            times: 10
            wait_time: 0s
      - delay: 700ms
      - lambda: |-
          const bool rf_pass = id(rf_seen);
          const bool ir_pass = id(ir_seen);

          if (rf_pass) {
            id(rf_pass_count)++;
          } else {
            id(rf_fail_count)++;
          }

          if (ir_pass) {
            id(ir_pass_count)++;
          } else {
            id(ir_fail_count)++;
          }

          if (rf_pass && ir_pass) {
            id(both_pass_count)++;
            ESP_LOGI(
              "FACTORY",
              "ROUND %u PASS | RF pass/fail=%u/%u IR pass/fail=%u/%u both pass/fail=%u/%u",
              id(test_round),
              id(rf_pass_count),
              id(rf_fail_count),
              id(ir_pass_count),
              id(ir_fail_count),
              id(both_pass_count),
              id(both_fail_count)
            );
          } else {
            id(both_fail_count)++;
            ESP_LOGI(
              "FACTORY",
              "ROUND %u FAIL | RF=%s IR=%s | RF pass/fail=%u/%u IR pass/fail=%u/%u both pass/fail=%u/%u",
              id(test_round),
              rf_pass ? "PASS" : "FAIL",
              ir_pass ? "PASS" : "FAIL",
              id(rf_pass_count),
              id(rf_fail_count),
              id(ir_pass_count),
              id(ir_fail_count),
              id(both_pass_count),
              id(both_fail_count)
            );
          }
      - if:
          condition:
            lambda: "return id(rf_seen) && id(ir_seen);"
          then:
            - script.execute: led_pass_on
          else:
            - script.execute: led_fail_blink
